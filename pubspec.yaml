name: atharna
description: AI-powered tourism & booking app (Flutter + Firebase + Gemini + Stripe)
publish_to: none
environment:
  sdk: ">=3.3.0 <4.0.0"
dependencies:
  flutter: {sdk: flutter}
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  cloud_functions: ^5.1.3
  google_sign_in: ^6.2.1
  google_generative_ai: ^0.4.6
  flutter_stripe: ^11.1.0
  provider: ^6.1.2
  qr_flutter: ^4.1.0
  intl: ^0.19.0
flutter:
  uses-material-design: true
